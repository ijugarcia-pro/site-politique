# Renvoyer l'ancienne adresse du site (le578esiege.pages.dev, projet Cloudflare « vote ») vers la
# nouvelle (docs/decisions.md, 3 nov. 2026). Pas encore lancé : à lancer à la main, avec l'accord de
# Julien. Ce projet est lié à Git : couper ses déploiements automatiques, sinon ils peuvent l'écraser.
name: Redirection de l'ancienne adresse

on:
  workflow_dispatch:

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déploiement des redirections sur l'ancien projet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.148.0 pages deploy redirection-ancienne-adresse --project-name vote \
            --branch main --commit-hash "$GITHUB_SHA" --commit-message "Redirection $GITHUB_RUN_ID" \
            --commit-dirty=true
