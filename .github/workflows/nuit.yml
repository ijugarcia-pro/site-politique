name: Pipeline de nuit

# Chaque nuit : récupérer les sources qui ont changé (t11), puis normaliser, contrôler, exporter,
# construire le site et l'envoyer à Cloudflare Pages (t12 à t17), seulement si une empreinte a
# changé. Un lancement à la main ou une modification du site ou du pipeline sur main reconstruit
# tout, même sans nouvelle donnée. Un échec des contrôles ne publie rien : la version en ligne
# reste la dernière valide. Minute 11 plutôt que l'heure pile : le planificateur de GitHub est
# saturé en début d'heure et y saute des passages.
on:
  schedule:
    - cron: "11 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - ".github/workflows/nuit.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: pipeline-nuit
  cancel-in-progress: false

env:
  PROJET_PAGES: le578esiege
  WRANGLER: wrangler@4.148.0

jobs:
  nuit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync

      - name: Reprendre les sources de la nuit précédente
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: sources-${{ github.run_id }}
          restore-keys: sources-

      - name: Ingestion
        id: ingestion
        run: uv run python -m pipeline.ingest

      - name: Normalisation (11 tables DuckDB)
        if: steps.ingestion.outputs.changement == 'true' || github.event_name != 'schedule'
        run: uv run python -m pipeline.normalize

      - name: Contrôles (6 règles ; un échec bloquant arrête le build)
        id: controles
        if: steps.ingestion.outputs.changement == 'true' || github.event_name != 'schedule'
        run: uv run python -m pipeline.checks

      # Tout ce qui suit jusqu'au déploiement porte la condition « contrôles réussis » :
      # un build arrêté ne publie rien.
      - name: Page « État des données »
        if: steps.controles.outcome == 'success'
        run: uv run python -m pipeline.etat

      - name: Export des données du site
        if: steps.controles.outcome == 'success'
        run: uv run python -m pipeline.export_site

      - name: Garder l'export du build
        if: steps.controles.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: export-${{ github.run_id }}
          path: export/
          retention-days: 14

      - uses: actions/setup-node@v4
        if: steps.controles.outcome == 'success'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Construction du site (Astro)
        id: site
        if: steps.controles.outcome == 'success'
        working-directory: site
        run: |
          npm ci
          npm test
          npm run build

      - name: Déploiement sur Cloudflare Pages
        if: steps.site.outcome == 'success' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Le projet est créé au premier passage (téléversement direct, docs/decisions.md).
          if ! npx --yes "$WRANGLER" pages project list | grep -qw "$PROJET_PAGES"; then
            npx --yes "$WRANGLER" pages project create "$PROJET_PAGES" --production-branch main
          fi
          npx --yes "$WRANGLER" pages deploy site/dist --project-name "$PROJET_PAGES" \
            --branch main --commit-hash "$GITHUB_SHA" --commit-message "Build $GITHUB_RUN_ID" \
            --commit-dirty=true

      - name: Garder les sources pour la nuit suivante
        if: always() && steps.ingestion.outputs.telecharge == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: sources-${{ github.run_id }}

      - name: Archiver les nouvelles versions (30 jours)
        if: always() && steps.ingestion.outputs.changement == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sources-${{ github.run_id }}
          path: ${{ steps.ingestion.outputs.fichiers }}
          retention-days: 30

      - name: Enregistrer l'état des sources
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/sources data/controles)" ]; then
            echo "État inchangé."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources data/controles
          git commit -m "Pipeline de nuit : état des sources et contrôles"
          # La normalisation réécrit aussi son rapport (docs/normalisation.md, data/mesures/) :
          # mis de côté le temps du rebase, seul l'état des sources et des contrôles est commité.
          git pull --rebase --autostash
          git push

      - name: Alerter si une source échoue depuis plusieurs nuits
        if: always() && hashFiles('data/raw/alerte.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="Ingestion de nuit : une source échoue depuis plusieurs nuits"
          ouverte=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number')
          if [ -n "$ouverte" ]; then
            gh issue comment "$ouverte" --body-file data/raw/alerte.md
          else
            gh issue create --title "$titre" --body-file data/raw/alerte.md
          fi

      - name: Alerter si les contrôles arrêtent le build ou signalent une archive trop ancienne
        if: always() && hashFiles('data/raw/alerte_controles.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="Pipeline de nuit : contrôles en échec"
          ouverte=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number')
          if [ -n "$ouverte" ]; then
            gh issue comment "$ouverte" --body-file data/raw/alerte_controles.md
          else
            gh issue create --title "$titre" --body-file data/raw/alerte_controles.md
          fi
